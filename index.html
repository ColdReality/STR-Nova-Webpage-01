<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STR NOVA :: Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Work+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050608;
            --text-main: #ffffff;
            --text-muted: #8e9bb0;
            --hex-cyan: #00f0ff;
            --hex-gold: #c8aa6e;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Work Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-black); color: var(--text-main); font-family: var(--font-body); }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 6%; background: rgba(5, 6, 8, 0.85); backdrop-filter: blur(12px);
            position: fixed; width: 100%; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(200, 170, 110, 0.15);
        }

        .brand { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 12px; }
        .brand-logo { height: 38px; width: auto; filter: invert(1) brightness(1.2); }
        .brand .sub-tag { font-family: var(--font-body); font-size: 0.75rem; color: var(--hex-gold); border: 1px solid rgba(200, 170, 110, 0.3); padding: 2px 8px; border-radius: 4px; }

        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--hex-cyan); }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 10%; }
        .hero-tag { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; color: var(--hex-gold); margin-bottom: 1rem; font-weight: 600; }
        .hero h1 { font-family: var(--font-display); font-size: 7.5rem; line-height: 0.85; margin-bottom: 1.5rem; background: linear-gradient(135deg, #ffffff 40%, var(--hex-cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.15rem; color: var(--text-muted); max-width: 520px; margin-bottom: 3rem; }

        .btn-nova { font-weight: 800; font-size: 0.95rem; color: #000; background: linear-gradient(135deg, #ffffff, var(--hex-gold)); padding: 1.1rem 2.8rem; text-decoration: none; text-transform: uppercase; clip-path: polygon(12px 0%, 100% 0%, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0% 100%, 0% 12px); }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="STR Nova Logo" class="brand-logo">
            <span>STR NOVA</span>
            <span class="sub-tag">TFT</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="jugadores.html">Jugadores</a></li>
            <li><a href="staff.html">Staff</a></li>
        </ul>
        <a href="#discord" class="btn-nova" style="padding: 0.6rem 1.4rem; font-size: 0.8rem;">DISCORD</a>
    </nav>

    <section class="hero">
        <span class="hero-tag">Teamfight Tactics Roster</span>
        <h1>STR NOVA</h1>
        <p>Maestros de la convergencia. Dominamos las composiciones de alto nivel, adaptándonos a cada aumentador y rotación de Set.</p>
        <a href="jugadores.html" class="btn-nova">VER JUGADORES</a>
    </section>
</body>
</html>
